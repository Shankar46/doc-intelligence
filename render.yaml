services:
  - type: web
    name: doc-intelligence-platform
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: huggingface
      - key: HUGGINGFACE_MODEL
        value: deepseek-ai/DeepSeek-R1
      - key: HUGGINGFACE_BASE_URL
        value: https://router.huggingface.co/hf-inference/v1
      - key: HUGGINGFACE_API_KEY
        sync: false
